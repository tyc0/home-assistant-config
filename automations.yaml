    - conditions:
      - condition: template
        value_template: "{{ is_state(left_blind, 'opening') or is_state(left_blind,
          'closing') or\n   is_state(right_blind, 'opening') or is_state(right_blind,
          'closing') }}\n"
      sequence:
      - target:
          entity_id:
          - '{{ left_blind }}'
          - '{{ right_blind }}'
        action: cover.stop_cover
