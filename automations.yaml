- id: '1746266319489'
  alias: Whatsapp - Automessage tester
  description: 'When Enhy sends C a WhatsApp message, send it to sensor.ha_text_ai_c_chat_autoreply
    and return the generated response to Enhy.

    '
  triggers:
  - event_type: new_whatsapp_message
    trigger: event
  conditions:
  - condition: template
    value_template: "{{  trigger.event.data.key.remoteJid\n    == '447308254154@s.whatsapp.net'
      }} "
    alias: 'Condition: Sender is Enhy'
  - condition: template
    value_template: "{{ 'status@broadcast' not in trigger.event.data.key.remoteJid\n
      \  and '@g.us' not in trigger.event.data.key.remoteJid }}\n"
    alias: 'Condition: Message is not a Story or a group message'
  actions:
  - variables:
      incoming_text: "{% if trigger.event.data.type == 'conversation' %}\n  {{ trigger.event.data.message.conversation
        }}\n{% elif trigger.event.data.type == 'extendedTextMessage' %}\n  {{ trigger.event.data.message.extendedTextMessage.text
        }}\n{% else %}\n  {{ '[Unsupported message type]' }}\n{% endif %}"
  - data:
      instance: sensor.ha_text_ai_c_chat_autoreply
      question: '{{ incoming_text }}'
    action: ha_text_ai.ask_question
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
    alias: 'Wait: Short buffer for response generation'
  - data:
      clientId: c
      to: 447308254154@s.whatsapp.net
      body:
        text: '{{ state_attr(''sensor.ha_text_ai_c_chat_autoreply'', ''response'')
          }}

          '
    action: whatsapp.send_message
  mode: queued
  max: 2
