- id: '1746560193153'
  alias: Vibrating Alarm Failsafe
  description: 'Ensures the vibrating alarm is armed with checks at 08:00, 18:00,
    and 22:00 each weekday. Cuts power to the alarm if presence is detected in the
    office between 09:00 and 09:57, using FP2 presence sensor, door contact, or door
    motion sensor. Resets the alarm switch at 12:00 to prepare it for the next day.
    If the switch cannot be re-armed during checks, a persistent notification is created.

    '
  triggers:
  - id: presence_detected
    entity_id:
    - binary_sensor.presence_sensor_fp2_1780_presence_sensor_1
    - binary_sensor.ds00_position
    - binary_sensor.ds00_motion
    to: 'on'
    alias: Presence detected (FP2, contact, or motion)
    trigger: state
  - at: '12:00:00'
    id: reset_alarm
    alias: Reset alarm at 12:00
    trigger: time
  - at: 08:00:00
    id: safety_check_08
    alias: Safety check at 08:00
    trigger: time
  - at: '18:00:00'
    id: safety_check_18
    alias: Safety check at 18:00
    trigger: time
  - at: '22:00:00'
    id: safety_check_22
    alias: Safety check at 22:00
    trigger: time
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_detected
      - condition: time
        after: 09:00:00
        before: 09:58:00
      sequence:
      - alias: Turn off alarm switch (MPM_01)
        target:
          entity_id: switch.mpm_01
        action: switch.turn_off
    - conditions:
      - condition: trigger
        id: reset_alarm
      sequence:
      - alias: Turn on alarm switch (reset at 12:00)
        target:
          entity_id: switch.mpm_01
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id:
        - safety_check_08
        - safety_check_18
        - safety_check_22
      sequence:
      - alias: Check if alarm switch is OFF
        condition: state
        entity_id: switch.mpm_01
        state: 'off'
      - alias: Attempt to turn ON the alarm switch
        target:
          entity_id: switch.mpm_01
        action: switch.turn_on
      - alias: Wait for state update
        delay:
          seconds: 5
      - alias: Verify if alarm switch is still OFF
        condition: state
        entity_id: switch.mpm_01
        state: 'off'
      - alias: Notify if switch failed to turn on
        data:
          title: Vibrating Alarm Issue
          message: 'The vibrating alarm switch (MPM_01) failed to turn on during the
            {{ trigger.alias }} check. Please investigate to ensure your failsafe
            alarm is operational.

            '
        action: persistent_notification.create
  mode: single
