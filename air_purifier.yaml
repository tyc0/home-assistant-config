type: custom:button-card
entity: fan.air_purifier
name: |
  [[[
    const name = 'Air Purifier';
    return name.split('').map((letter, index) =>
      `<span style="display: inline-block; animation: textfadeintro 1s both; animation-delay: ${1 + index * 0.1}s;">${letter === ' ' ? '&nbsp;' : letter}</span>`
    ).join('');
  ]]]
icon: phu:tesla-fan
tap_action:
  action: more-info
  haptic: success
custom_fields:
  status: |
    [[[
      const fanState = hass.states['fan.air_purifier'];
      const filterState = hass.states['sensor.air_purifier_filter_lifetime'];

      if (!fanState) return 'Offline';

      const isRunning = fanState.state === 'on';
      const percentage = fanState.attributes?.percentage || 0;
      const presetMode = fanState.attributes?.preset_mode;
      const isSleep = presetMode === 'sleep';

      let statusLine1, statusLine2;

      if (!isRunning) {
        statusLine1 = 'Off';
      } else if (isSleep) {
        statusLine1 = 'Sleep Mode';
      } else {
        statusLine1 = `${Math.round(percentage)}% Speed`;
      }

      const filterLife = filterState ? parseFloat(filterState.state) || 0 : 0;
      statusLine2 = `Filter ${Math.round(filterLife)}%`;

      return `
        <div style="display: flex; flex-direction: column; gap: calc(var(--card-size) * 0.013);">
          <span>${statusLine1.split('').map((char, index) =>
            `<span style="display: inline-block; animation: textfadeintro 1s both; animation-delay: ${1.3 + index * 0.1}s;">${char === ' ' ? '&nbsp;' : char}</span>`
          ).join('')}</span>
          <span style="font-size: calc(var(--card-size) * 0.043); opacity: 0.7;">${statusLine2.split('').map((char, index) =>
            `<span style="display: inline-block; animation: textfadeintro 1s both; animation-delay: ${1.6 + index * 0.1}s;">${char === ' ' ? '&nbsp;' : char}</span>`
          ).join('')}</span>
        </div>
      `;
    ]]]
  filter_arc: |
    [[[
      // Get filter percentage
      const ent  = hass.states['sensor.air_purifier_filter_lifetime'];
      const pct  = ent ? Math.max(0, Math.min(100, parseFloat(ent.state))) : 0;

      // Color scale
      let col = '#72EFDD';
      if (pct < 30)      col = '#FF2E92';
      else if (pct < 70) col = '#FFD700';

      // Card & circle geometry
      const S  = 230;
      const R  = 0.72 * S / 2;
      const cx = 0.34 * S;
      const cy = 0.68 * S;

      // Arc: 180° sweep, from left (180°) to bottom (270°)
      const totalSweep = Math.PI; // 180°
      const sweep = totalSweep * (pct / 100);
      const startAngle = Math.PI; // 180°
      const endAngle = startAngle + sweep;

      // Start and end points
      const sx = cx + R * Math.cos(startAngle);
      const sy = cy + R * Math.sin(startAngle);
      const ex = cx + R * Math.cos(endAngle);
      const ey = cy + R * Math.sin(endAngle);

      // Large arc flag: 0 for <= 180°
      const largeArcFlag = 0;

      return `
        <svg viewBox="0 0 ${S} ${S}"
             style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
          <path d="M ${sx} ${sy}
                   A ${R} ${R} 0 ${largeArcFlag} 1 ${ex} ${ey}"
                fill="none" stroke="${col}"
                stroke-width="4" stroke-linecap="round"
                style="opacity:0;animation:arcFadeIn .8s ease-out forwards .2s"/>
        </svg>`;
    ]]]

  control1:
    card:
      type: custom:button-card
      entity: fan.air_purifier
      icon: mdi:power
      show_name: false
      tap_action:
        action: call-service
        service: fan.turn_off
        service_data:
          entity_id: fan.air_purifier
        haptic: success
      styles:
        card:
          - border-radius: 50%
          - background: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const isOff = !fanState || fanState.state === 'off';
                return isOff ? 'linear-gradient(135deg, rgba(114, 239, 221, 0.7) 0%, rgba(114, 239, 221, 1) 100%)'
                             : 'linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.2) 100%)';
              ]]]
          - width: calc(var(--card-size) * 0.192)
          - height: calc(var(--card-size) * 0.192)
          - box-shadow: none
          - border: none
        icon:
          - width: calc(var(--card-size) * 0.096)
          - height: calc(var(--card-size) * 0.096)
          - color: var(--primary-text-color)
          - opacity: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const isOff = !fanState || fanState.state === 'off';
                return isOff ? '1' : '0.2';
              ]]]
  control2:
    card:
      type: custom:button-card
      entity: fan.air_purifier
      icon: mdi:sleep
      show_name: false
      tap_action:
        action: call-service
        service: fan.set_preset_mode
        service_data:
          entity_id: fan.air_purifier
          preset_mode: sleep
        haptic: success
      styles:
        card:
          - border-radius: 50%
          - background: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const isSleep = fanState?.attributes?.preset_mode === 'sleep';
                return isSleep ? 'linear-gradient(135deg, rgba(138, 170, 229, 0.7) 0%, rgba(138, 170, 229, 1) 100%)'
                               : 'linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.2) 100%)';
              ]]]
          - width: calc(var(--card-size) * 0.192)
          - height: calc(var(--card-size) * 0.192)
          - box-shadow: none
          - border: none
        icon:
          - width: calc(var(--card-size) * 0.096)
          - height: calc(var(--card-size) * 0.096)
          - color: var(--primary-text-color)
          - opacity: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const isSleep = fanState?.attributes?.preset_mode === 'sleep';
                return isSleep ? '1' : '0.2';
              ]]]
  control3:
    card:
      type: custom:button-card
      entity: fan.air_purifier
      icon: mdi:fan-speed-1
      show_name: false
      tap_action:
        action: call-service
        service: fan.set_percentage
        service_data:
          entity_id: fan.air_purifier
          percentage: 33
        haptic: success
      styles:
        card:
          - border-radius: 50%
          - background: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const percentage = fanState?.attributes?.percentage || 0;
                const isLow = fanState?.state === 'on' && fanState?.attributes?.preset_mode !== 'sleep' && percentage <= 40;
                return isLow ? 'linear-gradient(135deg, rgba(0, 133, 255, 0.7) 0%, rgba(0, 133, 255, 1) 100%)'
                             : 'linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.2) 100%)';
              ]]]
          - width: calc(var(--card-size) * 0.192)
          - height: calc(var(--card-size) * 0.192)
          - box-shadow: none
          - border: none
        icon:
          - width: calc(var(--card-size) * 0.096)
          - height: calc(var(--card-size) * 0.096)
          - color: var(--primary-text-color)
          - opacity: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const percentage = fanState?.attributes?.percentage || 0;
                const isLow = fanState?.state === 'on' && fanState?.attributes?.preset_mode !== 'sleep' && percentage <= 40;
                return isLow ? '1' : '0.2';
              ]]]
  control4:
    card:
      type: custom:button-card
      entity: fan.air_purifier
      icon: mdi:fan-speed-2
      show_name: false
      tap_action:
        action: call-service
        service: fan.set_percentage
        service_data:
          entity_id: fan.air_purifier
          percentage: 66
        haptic: success
      styles:
        card:
          - border-radius: 50%
          - background: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const percentage = fanState?.attributes?.percentage || 0;
                const isMed = fanState?.state === 'on' && fanState?.attributes?.preset_mode !== 'sleep' && percentage > 40 && percentage <= 80;
                return isMed ? 'linear-gradient(135deg, rgba(101, 16, 248, 0.7) 0%, rgba(101, 16, 248, 1) 100%)'
                             : 'linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.2) 100%)';
              ]]]
          - width: calc(var(--card-size) * 0.192)
          - height: calc(var(--card-size) * 0.192)
          - box-shadow: none
          - border: none
        icon:
          - width: calc(var(--card-size) * 0.096)
          - height: calc(var(--card-size) * 0.096)
          - color: var(--primary-text-color)
          - opacity: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const percentage = fanState?.attributes?.percentage || 0;
                const isMed = fanState?.state === 'on' && fanState?.attributes?.preset_mode !== 'sleep' && percentage > 40 && percentage <= 80;
                return isMed ? '1' : '0.2';
              ]]]
  control5:
    card:
      type: custom:button-card
      entity: fan.air_purifier
      icon: mdi:fan-speed-3
      show_name: false
      tap_action:
        action: call-service
        service: fan.set_percentage
        service_data:
          entity_id: fan.air_purifier
          percentage: 100
        haptic: success
      styles:
        card:
          - border-radius: 50%
          - background: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const percentage = fanState?.attributes?.percentage || 0;
                const isHigh = fanState?.state === 'on' && fanState?.attributes?.preset_mode !== 'sleep' && percentage > 80;
                return isHigh ? 'linear-gradient(135deg, rgba(255, 46, 146, 0.7) 0%, rgba(255, 46, 146, 1) 100%)'
                              : 'linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.2) 100%)';
              ]]]
          - width: calc(var(--card-size) * 0.192)
          - height: calc(var(--card-size) * 0.192)
          - box-shadow: none
          - border: none
        icon:
          - width: calc(var(--card-size) * 0.096)
          - height: calc(var(--card-size) * 0.096)
          - color: var(--primary-text-color)
          - opacity: |
              [[[
                const fanState = hass.states['fan.air_purifier'];
                const percentage = fanState?.attributes?.percentage || 0;
                const isHigh = fanState?.state === 'on' && fanState?.attributes?.preset_mode !== 'sleep' && percentage > 80;
                return isHigh ? '1' : '0.2';
              ]]]
  control6:
    card:
      type: custom:button-card
      entity: select.air_purifier_night_light_level
      icon: mdi:lightbulb-outline
      show_name: false
      tap_action:
        action: call-service
        service: browser_mod.popup
        service_data:
          title: Air Purifier Settings
          content:
            type: entities
            entities:
              - switch.air_purifier_display
              - select.air_purifier_night_light_level
            show_header_toggle: false
        haptic: success
      styles:
        card:
          - border-radius: 50%
          - background: |
              [[[
                const state = hass.states['select.air_purifier_night_light_level'];
                const level = state?.state || 'off';
                const isOn = level !== 'off';
                const intensity = level === 'on' ? 1 : level === 'dim' ? 0.6 : 0.2;
                return isOn ? `linear-gradient(135deg, rgba(255, 215, 0, ${intensity * 0.7}) 0%, rgba(255, 215, 0, ${intensity}) 100%)`
                            : 'linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.2) 100%)';
              ]]]
          - width: calc(var(--card-size) * 0.192)
          - height: calc(var(--card-size) * 0.192)
          - box-shadow: none
          - border: none
        icon:
          - width: calc(var(--card-size) * 0.096)
          - height: calc(var(--card-size) * 0.096)
          - color: var(--primary-text-color)
          - opacity: |
              [[[
                const state = hass.states['select.air_purifier_night_light_level'];
                const isOn = state?.state !== 'off';
                return isOn ? '1' : '0.2';
              ]]]
styles:
  grid:
    - grid-template-areas: "\"n btn\" \"status btn\" \"i btn\""
    - grid-template-columns: 1fr min-content
    - grid-template-rows: min-content min-content 1fr
  card:
    - "--card-size": 230px
    - height: var(--card-size)
    - width: var(--card-size)
    - padding: >-
        calc(var(--card-size) * 0.088) calc(var(--card-size) * 0.032)
        calc(var(--card-size) * 0.088) calc(var(--card-size) * 0.088)
    - background: var(--card-background-color, rgba(255, 255, 255, 0.04))
    - animation: cardpopintro 1s 0.3s both
    - border: none
    - box-shadow: none
  name:
    - grid-area: "n"
    - font-size: calc(var(--card-size) * 0.072)
    - font-weight: 500
    - justify-self: start
    - align-self: start
    - width: 100%
    - text-align: left
    - display: block
  custom_fields:
    status:
      - grid-area: status
      - justify-self: start
      - align-self: start
      - width: 100%
      - text-align: left
      - display: block
      - font-size: calc(var(--card-size) * 0.05)
      - padding-top: calc(var(--card-size) * 0.008)
    filter_arc:
      - position: absolute
      - top: 0
      - left: 0
      - width: 100%
      - height: 100%
      - pointer-events: none
      - z-index: 1
    control1:
      - position: absolute
      - top: calc(var(--card-size) * 0.1)
      - right: calc(var(--card-size) * 0.032)
      - animation: cardpopintro 1s 0.8s both
    control2:
      - position: absolute
      - top: calc(var(--card-size) * 0.35)
      - right: calc(var(--card-size) * 0.032)
      - animation: cardpopintro 1s 0.9s both
    control3:
      - position: absolute
      - top: calc(var(--card-size) * 0.6)
      - right: calc(var(--card-size) * 0.032)
      - animation: cardpopintro 1s 1s both
    control4:
      - position: absolute
      - top: calc(var(--card-size) * 0.85)
      - right: calc(var(--card-size) * 0.032)
      - animation: cardpopintro 1s 1.1s both
    control5:
      - position: absolute
      - top: calc(var(--card-size) * 1.1)
      - right: calc(var(--card-size) * 0.032)
      - animation: cardpopintro 1s 1.2s both
    control6:
      - position: absolute
      - top: calc(var(--card-size) * 1.35)
      - right: calc(var(--card-size) * 0.032)
      - animation: cardpopintro 1s 1.3s both
  img_cell:
    - grid-area: i
    - justify-content: start
    - position: absolute
    - width: calc(var(--card-size) * 0.72)
    - height: calc(var(--card-size) * 0.72)
    - left: "-2%"
    - bottom: "-4%"
    - margin: 0 0 calc(var(--card-size) * -0.08) calc(var(--card-size) * -0.08)
    - background: var(--contrast3, rgba(200, 200, 200, 0.9))
    - opacity: "0.8"
    - border-radius: 50%
    - animation: cardpopintro 0.4s 0.6s both
  icon:
    - position: relative
    - width: calc(var(--card-size) * 0.4)
    - color: var(--contrast20, rgba(5, 5, 5, 1))
    - opacity: "0.2"
    - animation: |
        [[[
          const fanState = hass.states['fan.air_purifier'];
          const isRunning = fanState?.state === 'on';
          const isSleep = fanState?.attributes?.preset_mode === 'sleep';
          if (isRunning) {
            return isSleep ? 'cardpopintro 0.8s 0.8s both, iconSpinSlow 4s linear infinite 1.6s'
                           : 'cardpopintro 0.8s 0.8s both, iconSpinFast 2s linear infinite 1.6s';
          }
          return 'cardpopintro 0.8s 0.8s both';
        ]]]
extra_styles: |
  @keyframes cardpopintro {
    0% { transform: scale(0); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  @keyframes textfadeintro {
    from { transform: scaleX(0.2) translateX(100px); filter: blur(20px); opacity: 0; }
    to { transform: scaleX(1) translateX(0); filter: blur(0); opacity: 1; }
  }

  @keyframes iconSpinFast {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes iconSpinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes arcFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
card_mod:
  style: |
    :host {
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
