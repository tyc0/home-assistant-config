
# | START: lights_bedroom.yaml
# |  PATH: /config/packages/light/lights_bedroom.yaml


# ╭────────────────────╮
# │   GROUP
# ╰────────────────────╯
group:

# ➔ Both Elgato light panels
  elgato_panels:
    name: Elgato Panels
    entities:
      - light.elgato_panel_01
      - light.elgato_panel_02
    all: true

# ➔ Both lightstrips under each side of bed
  bedframe_lightstrips:
    name: Bedframe Lightstrips
    entities:
      - light.hue_lightstrip_bed_c_side
      - light.hue_lightstrip_bed_e_side 
    all: true



# ╭────────────────────╮
# │   INPUT DATETIME
# ╰────────────────────╯
input_datetime:

# ➔ Last Bedroom Entry
  last_bedroom_entry:
    name: Last Bedroom Entry
    has_date: true
    has_time: true

# ➔ Last Manual Override
  last_manual_override:
    name: Last Manual Override
    has_date: true
    has_time: true



# ╭────────────────────╮
# │   INPUT NUMBER
# ╰────────────────────╯
input_number:

# ➔ Length of time to consider the room empty
  absence_duration:
    name: Room Absence Duration
    min: 1
    max: 30
    step: 1
    unit_of_measurement: minutes
    icon: mdi:timer-outline
    initial: 5

# ➔ Duration to wait after a manual override before resuming automatic lighting
  manual_override_duration:
    name: Manual Override Duration
    min: 1
    max: 60
    step: 1
    unit_of_measurement: minutes
    icon: mdi:lock-clock
    initial: 5



# ╭────────────────────╮
# │   AUTOMATION
# ╰────────────────────╯
automation:

# ➔ Record Manual Override for Bedroom Lights
  - alias: Record Manual Override for Bedroom Lights
    id: record_manual_override_for_bedroom_lights
    trigger:
      - platform: event
        event_type: hue_event
        event_data:
          id: hue_wall_switch_module_3_button_1
          type: short_release
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_manual_override
        data:
          datetime: "{{ now().isoformat() }}"
    mode: single


# ➔ Automatically illuminates under-bed lighting when entering bedroom from Floor 02 during night hours
  - alias: "Bedroom night lights"
    description: "Soft amber under-bed lighting for safe nighttime navigation from Floor 02 to Bedroom"
    id: bedroom_night_lights
    trigger:
      - platform: state
        entity_id: binary_sensor.presence_sensor_fp2_9c35_presence_sensor_2
        to: "on"
    
    condition:
      # Fast checks first - time window and light state
      - condition: time
        after: "00:00:00"
        before: "08:00:00"
      
      - condition: state
        entity_id: light.room_02
        state: "off"
      
      # Combined direction and cooldown validation
      - condition: template
        value_template: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set floor02_last = as_timestamp(states.binary_sensor.presence_sensor_fp2_9c35_presence_sensor_10.last_changed or 0) %}
          {% set automation_last = as_timestamp(this.last_triggered or 0) %}
          {{ (now_ts - floor02_last) < 5 and (now_ts - automation_last) > 60 }}
    
    action:
      - service: light.turn_on
        target:
          entity_id: group.bedframe_lightstrips
        data:
          rgb_color: [255, 147, 41]
          brightness_pct: 10
          transition: 1
      
      - delay:
          seconds: 10
      
      - service: light.turn_off
        target:
          entity_id: group.bedframe_lightstrips
        data:
          transition: 2
    
    mode: single








# | END: lights_bedroom.yaml

