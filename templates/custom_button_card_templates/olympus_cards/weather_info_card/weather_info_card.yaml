# | START: weather_info_card.yaml
# | PATH: /config/templates/custom_button_card_templates/olympus_cards/weather_info_card/weather_info_card.yaml



# ➔ Weather Information Card
#   Comprehensive weather display with dynamic weather icons, temperature colors, and precipitation
#   forecasting. Features intelligent icon selection including moon phases, sunrise/sunset transitions,
#   and weather state mapping. Core functionality:
#
#     • Dynamic weather icons with sun transition detection and moon phase display
#     • Color-coded temperature with animated digit display
#     • Precipitation forecast with timing and snow/rain differentiation
#     • Tap navigation to weather dashboard, hold for popup forecast
#     • Performance-optimized with caching and error handling


# | EXAMPLE USAGE

# ➔ REQUIRED:
# type: custom:button-card
# template: weather_info_card

# ➔ OPTIONAL:
# variables:
#   weather_entity: weather.pirateweather
#   sun_entity: sun.sun
#   moon_phase_entity: sensor.moon_phase
#   precip_intensity_entity: sensor.pirateweather_precip_intensity
#   precip_forecast_entity: sensor.pirateweather_today_precipitation_accumulation
#   fallback_weather_entity: weather.forecast_home
#   navigation_path: /dashboard-home/weather
#   popup_title: Weather Details



weather_info_card:

  variables:
    weather_entity: weather.pirateweather                                          # Primary weather entity for temperature and conditions
    sun_entity: sun.sun                                                           # Required for sunrise/sunset transition detection
    moon_phase_entity: sensor.moon_phase                                          # Used for nighttime moon phase icons
    precip_intensity_entity: sensor.pirateweather_precip_intensity                # Validates actual vs forecasted precipitation
    precip_forecast_entity: sensor.pirateweather_today_precipitation_accumulation # Hourly precipitation forecast with 'values' attribute
    fallback_weather_entity: weather.forecast_home                               # Backup when primary shows false rain conditions
    navigation_path: /dashboard-home/weather
    popup_title: Weather Details

  show_icon: false
  show_name: false
  show_state: false

  tap_action:
    action: navigate
    navigation_path: '[[[ return variables.navigation_path; ]]]'
    haptic: success

  hold_action:
    action: fire-dom-event                                                           # Browser_mod popup for detailed forecast
    browser_mod:
      service: browser_mod.popup
      data:
        title: '[[[ return variables.popup_title; ]]]'
        content:
          type: weather-forecast
          entity: '[[[ return variables.weather_entity; ]]]'
          show_forecast: true

  styles:
    card:
      - height: 120px
      - width: 220px
      - position: relative
      - margin-top: 110px                                                          # Extra space for large weather icon overflow
      - display: flex
      - align-items: center
      - background: var(--card-background-color, rgba(0, 0, 0, 0.08))
      - backdrop-filter: blur(3px)
      - border-radius: var(--ha-card-border-radius, 12px)
      - animation: cardIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) both
      - border: none
      - box-shadow: none

    custom_fields:
      weather_icon:
        - position: absolute
        - top: 50%
        - left: 5px
        - width: 115px                                                             # Large icon size for visual impact
        - transform: translateY(-50%)
        - animation: iconIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both 0.4s      # Bouncy entrance effect

      temp_field:
        - position: absolute
        - bottom: 52px
        - right: 20px
        - overflow: visible                                                        # Allow degree symbol positioning
        - font-size: 2em
        - font-weight: 400
        - animation: tempIn 0.7s ease-out both 0.8s

      rain_field:
        - position: absolute
        - bottom: 25px                                                             # Positioned below temperature
        - right: 26px
        - font-size: 0.83em
        - font-weight: 300
        - color: var(--primary-text-color)
        - white-space: nowrap
        - animation: tempIn 0.6s ease-out both 1s
        - overflow: visible

  custom_fields:
    weather_icon: |
      [[[
        // Constants
        const CACHE_DURATION_MS = 300000; // 5 minutes
        const MILLISECONDS_PER_HOUR = 3600000;
        const MILLISECONDS_PER_DAY = 86400000;
        const ICON_SIZE = 115;
        const GLOW_SHADOW = 'drop-shadow(0 0 3px rgba(255,255,255,0.2))';

        const TRANSITION_MINUTES_BY_MONTH = [10, 10, 15, 15, 20, 20, 20, 20, 15, 15, 10, 10];

        const WEATHER_STATE_MAP = {
          clear: ['clear-day', 'clear-night'],
          sunny: ['clear-day', 'clear-night'],
          exceptional: ['clear-day', 'clear-night'],
          partlycloudy: ['partly-cloudy-day', 'partly-cloudy-night'],
          cloudy: ['cloudy', 'cloudy'],
          rainy: ['rainy', 'partly-cloudy-night-rain'],
          lightning: ['thunderstorms', 'thunderstorms-night'],
          pouring: ['rain', 'partly-cloudy-night-rain'],
          snowy: ['snow', 'partly-cloudy-night-snow'],
          fog: ['fog', 'fog-night']
        };

        const MOON_PHASE_CONFIG = {
          full_moon: { color: 'hsl(40, 20%, 95%)', glow: true },
          waxing_gibbous: { color: 'hsl(35, 15%, 90%)', glow: false },
          first_quarter: { color: 'hsl(30, 10%, 88%)', glow: false },
          waxing_crescent: { color: 'hsl(25, 5%, 85%)', glow: false },
          new_moon: { color: 'hsl(220, 5%, 80%)', glow: false },
          waning_crescent: { color: 'hsl(225, 5%, 82%)', glow: false },
          last_quarter: { color: 'hsl(230, 10%, 85%)', glow: false },
          waning_gibbous: { color: 'hsl(235, 15%, 88%)', glow: false }
        };

        // Utility functions
        const createIcon = (name, options = {}) => {
          const { size = ICON_SIZE, color = '', glow = false } = options;
          const styles = [
            `width:${size}px`,
            `height:${size}px`,
            `--mdc-icon-size:${size}px`,
            color && `color:${color}`,
            glow && `filter:${GLOW_SHADOW}`
          ].filter(Boolean).join(';');

          return `<ha-icon icon="meteocons:${name}-fill" style="${styles}"></ha-icon>`;
        };

        const safeEntityAccess = (entityId, attribute = null, fallbackValue = '') => {
          try {
            const entity = hass?.states?.[entityId];
            if (!entity) return fallbackValue;

            return attribute
              ? entity.attributes?.[attribute] ?? fallbackValue
              : entity.state ?? fallbackValue;
          } catch (error) {
            console.warn(`Weather card: Error accessing ${entityId}${attribute ? '.' + attribute : ''}:`, error);
            return fallbackValue;
          }
        };

        const parseDateTime = (dateString) => {
          if (!dateString || typeof dateString !== 'string') return null;

          try {
            const parsedDate = new Date(dateString);
            return isNaN(parsedDate.getTime()) ? null : parsedDate;
          } catch {
            return null;
          }
        };

        const calculateSunTransition = () => {
          const sunState = safeEntityAccess(variables.sun_entity);
          if (!sunState) return null;

          const isNight = sunState === 'below_horizon';
          const currentTime = new Date();
          const currentMonth = currentTime.getMonth();
          const transitionDurationMs = TRANSITION_MINUTES_BY_MONTH[currentMonth] * 60000;

          // Parse sun times with validation
          const nextRising = parseDateTime(safeEntityAccess(variables.sun_entity, 'next_rising'));
          const nextSetting = parseDateTime(safeEntityAccess(variables.sun_entity, 'next_setting'));

          if (!nextRising || !nextSetting) {
            console.warn('Weather card: Invalid sun times, skipping transition calculation');
            return { isTransition: false, isNight };
          }

          // Calculate most recent transition event
          const now = currentTime.getTime();
          let lastTransitionTime;

          if (isNight) {
            // Find most recent sunset
            lastTransitionTime = nextSetting.getTime() > now
              ? nextSetting.getTime() - MILLISECONDS_PER_DAY
              : nextSetting.getTime();
          } else {
            // Find most recent sunrise
            lastTransitionTime = nextRising.getTime() > now
              ? nextRising.getTime() - MILLISECONDS_PER_DAY
              : nextRising.getTime();
          }

          const timeSinceTransition = now - lastTransitionTime;

          // Check if within transition window
          if (timeSinceTransition >= 0 && timeSinceTransition <= transitionDurationMs) {
            const progress = Math.min(timeSinceTransition / transitionDurationMs, 1);
            const baseHue = isNight ? 25 : 40;
            const saturation = 85 + progress * 10;
            const lightness = 60 + progress * 5;

            return {
              isTransition: true,
              isNight,
              color: `hsl(${baseHue}, ${saturation}%, ${lightness}%)`,
              iconName: isNight ? 'sunset' : 'sunrise'
            };
          }

          return { isTransition: false, isNight };
        };

        const normalizeWeatherState = () => {
          let weatherState = safeEntityAccess(variables.weather_entity, null, 'clear');
          weatherState = weatherState.replace(/-(?:day|night)$/, '');

          // Handle rainy state with no precipitation
          if (weatherState === 'rainy') {
            const precipIntensity = parseFloat(safeEntityAccess(variables.precip_intensity_entity, null, '0'));
            if (precipIntensity === 0) {
              const fallbackState = safeEntityAccess(variables.fallback_weather_entity, null, 'clear');
              weatherState = fallbackState.replace(/-(?:day|night)$/, '');
            }
          }

          return weatherState;
        };

        const getMoonPhaseIcon = () => {
          const moonPhase = safeEntityAccess(variables.moon_phase_entity);
          const phaseConfig = MOON_PHASE_CONFIG[moonPhase];

          if (!phaseConfig) return null;

          const iconName = `moon-${moonPhase.replace('_', '-')}`;
          return createIcon(iconName, {
            color: phaseConfig.color,
            glow: phaseConfig.glow
          });
        };

        const getStandardWeatherIcon = (weatherState, isNight) => {
          const [dayIcon, nightIcon] = WEATHER_STATE_MAP[weatherState] || ['clear-day', 'clear-night'];
          const iconName = isNight ? nightIcon : dayIcon;
          return createIcon(iconName);
        };

        // Main execution with caching
        const cacheKey = `weather_icon_${variables.weather_entity}_${Math.floor(Date.now() / CACHE_DURATION_MS)}`;

        if (window.weatherIconCache?.key === cacheKey) {
          return window.weatherIconCache.value;
        }

        try {
          // Check for sun transition state
          const sunTransition = calculateSunTransition();

          if (sunTransition?.isTransition) {
            const transitionIcon = createIcon(sunTransition.iconName, {
              color: sunTransition.color,
              glow: true
            });
            window.weatherIconCache = { key: cacheKey, value: transitionIcon };
            return transitionIcon;
          }

          const isNight = sunTransition?.isNight ?? false;
          const weatherState = normalizeWeatherState();

          // Handle moon phases for clear night conditions
          if (isNight && /^(?:clear|sunny|exceptional|partlycloudy|cloudy)$/.test(weatherState)) {
            const moonIcon = getMoonPhaseIcon();
            if (moonIcon) {
              window.weatherIconCache = { key: cacheKey, value: moonIcon };
              return moonIcon;
            }
          }

          // Standard weather icon
          const standardIcon = getStandardWeatherIcon(weatherState, isNight);
          window.weatherIconCache = { key: cacheKey, value: standardIcon };
          return standardIcon;

        } catch (error) {
          console.error('Weather card icon generation failed:', error);
          const fallbackIcon = createIcon('clear-day');
          window.weatherIconCache = { key: cacheKey, value: fallbackIcon };
          return fallbackIcon;
        }
      ]]]

    temp_field: |
      [[[
        // Constants
        const TEMPERATURE_COLORS = {
          VERY_COLD: '#52B8F9',    // <= 5°C
          COLD: '#72CAFF',         // <= 15°C
          HOT: '#FFD700',          // >= 25°C
          VERY_HOT: '#E56B42'      // >= 30°C
        };

        const ANIMATION_CONFIG = {
          baseDelay: 1.3,
          digitDelay: 0.1,
          degreeOffset: 0.05,
          duration: '0.4s'
        };

        // Utility functions
        const getTemperatureColor = (temperature) => {
          if (temperature <= 5) return TEMPERATURE_COLORS.VERY_COLD;
          if (temperature <= 15) return TEMPERATURE_COLORS.COLD;
          if (temperature >= 30) return TEMPERATURE_COLORS.VERY_HOT;
          if (temperature >= 25) return TEMPERATURE_COLORS.HOT;
          return '';
        };

        const createAnimatedSpan = (content, delay, extraStyles = '') => {
          const animationStyle = `display:inline-block;animation:digitIn ${ANIMATION_CONFIG.duration} ease-out both ${delay}s`;
          const styles = extraStyles ? `${animationStyle};${extraStyles}` : animationStyle;
          return `<span style="${styles}">${content}</span>`;
        };

        // Main execution
        try {
          const temperatureValue = hass?.states?.[variables.weather_entity]?.attributes?.temperature;
          const temperature = Math.round(Number(temperatureValue) || 23);
          const temperatureString = String(Math.abs(temperature));
          const temperatureColor = getTemperatureColor(temperature);

          const colorStyle = temperatureColor ? `color:${temperatureColor}` : '';

          // Create animated digit spans
          const digitSpans = [...temperatureString].map((digit, index) =>
            createAnimatedSpan(
              digit,
              ANIMATION_CONFIG.baseDelay + index * ANIMATION_CONFIG.digitDelay,
              colorStyle
            )
          );

          // Create degree symbol
          const degreeDelay = ANIMATION_CONFIG.baseDelay +
            temperatureString.length * ANIMATION_CONFIG.digitDelay +
            ANIMATION_CONFIG.degreeOffset;
          const degreeStyles = `font-size:0.6em;vertical-align:super${colorStyle ? ';' + colorStyle : ''}`;
          const degreeSpan = createAnimatedSpan('°', degreeDelay, degreeStyles);

          // Handle negative temperatures
          const negativePrefix = temperature < 0
            ? createAnimatedSpan('-', ANIMATION_CONFIG.baseDelay - ANIMATION_CONFIG.digitDelay, colorStyle)
            : '';

          return negativePrefix + digitSpans.join('') + degreeSpan;

        } catch (error) {
          console.error('Weather card temperature display error:', error);
          return createAnimatedSpan('--°', ANIMATION_CONFIG.baseDelay, 'font-size:0.6em;vertical-align:super');
        }
      ]]]

    rain_field: |
      [[[
        // Constants
        const PRECIPITATION_CONFIG = {
          threshold: 0.1,
          baseDelay: 1.2,
          digitDelay: 0.1,
          freezingPoint: 0,
          iconSize: 24,
          svgViewBox: '0 0 24 24'
        };

        const SVG_ELEMENTS = {
          dropPath: 'M12,3.77L11.25,4.61C11.25,4.61 9.97,6.06 8.68,7.94C7.39,9.82 6,12.07 6,14.23A6,6 0 0,0 12,20.23A6,6 0 0,0 18,14.23C18,12.07 16.61,9.82 15.32,7.94C14.03,6.06 12.75,4.61 12.75,4.61L12,3.77Z',
          noRainLine: '<line x1="4" y1="20" x2="20" y2="4" stroke="var(--contrast8,#888)" stroke-width="2"/>',
          iconStyle: 'vertical-align:-6px;margin-right:-0.5px'
        };

        const GRADIENT_COLORS = {
          snow: ['#86c3db', '#5eafcf'],
          rain: ['#64b5f6', '#1976d2']
        };

        // Utility functions
        const createSVGElement = (content) =>
          `<svg xmlns="http://www.w3.org/2000/svg" width="${PRECIPITATION_CONFIG.iconSize}" height="${PRECIPITATION_CONFIG.iconSize}" viewBox="${PRECIPITATION_CONFIG.svgViewBox}" style="${SVG_ELEMENTS.iconStyle}">${content}</svg>`;

        const createAnimatedSpan = (content, delay, additionalStyles = '') => {
          const baseStyle = `display:inline-block;animation:digitIn 0.4s ease-out both ${delay}s`;
          const styles = additionalStyles ? `${baseStyle};${additionalStyles}` : baseStyle;
          return `<span style="${styles}">${content}</span>`;
        };

        const createLinearGradient = (gradientId, colorStops) => {
          const stops = colorStops.map((color, index) =>
            `<stop offset="${index * 100}%" stop-color="${color}"/>`
          ).join('');

          return `<defs><linearGradient id="${gradientId}" x1="0%" y1="0%" x2="100%" y2="100%">${stops}</linearGradient></defs>`;
        };

        const formatTimeString = (hourIndex) => {
          if (hourIndex === 0) return 'now';

          const timeDate = new Date();
          timeDate.setHours(hourIndex, 0, 0, 0);

          return timeDate
            .toLocaleTimeString([], { hour: 'numeric', hour12: true })
            .replace(/\s/g, '')
            .toLowerCase();
        };

        const createPrecipitationIcon = (gradientId, colorPair) => {
          const gradient = createLinearGradient(gradientId, colorPair);
          const pathElement = `<path fill="url(#${gradientId})" class="rain-drop" d="${SVG_ELEMENTS.dropPath}"/>`;
          return createSVGElement(gradient + pathElement);
        };

        const createNoRainIcon = () => {
          const pathElement = `<path fill="var(--contrast8,#888)" d="${SVG_ELEMENTS.dropPath}"/>`;
          return createSVGElement(pathElement + SVG_ELEMENTS.noRainLine);
        };

        // Main execution
        try {
          const temperature = Number(hass?.states?.[variables.weather_entity]?.attributes?.temperature || 23);
          const baseDelay = PRECIPITATION_CONFIG.baseDelay;

          // Handle freezing conditions (snow display)
          if (temperature <= PRECIPITATION_CONFIG.freezingPoint) {
            const gradientId = `snow_${Date.now().toString(36)}`;
            const snowIcon = createPrecipitationIcon(gradientId, GRADIENT_COLORS.snow);
            return createAnimatedSpan(snowIcon, baseDelay);
          }

          // Get precipitation forecast data
          const precipitationEntity = hass?.states?.[variables.precip_forecast_entity];
          const precipitationValues = precipitationEntity?.attributes?.values;

          if (!Array.isArray(precipitationValues) || precipitationValues.length === 0) {
            console.warn('Weather card: Precipitation data unavailable');
            return createAnimatedSpan(createNoRainIcon(), baseDelay);
          }

          // Process and validate precipitation data
          const processedPrecipData = precipitationValues
            .map(value => Number(value))
            .filter(value => !isNaN(value) && value >= 0);

          if (processedPrecipData.length === 0) {
            return createAnimatedSpan(createNoRainIcon(), baseDelay);
          }

          // Find first significant precipitation
          const significantRainIndex = processedPrecipData.findIndex(
            value => value >= PRECIPITATION_CONFIG.threshold
          );

          if (significantRainIndex === -1) {
            return createAnimatedSpan(createNoRainIcon(), baseDelay);
          }

          // Create rain icon and time display
          const gradientId = `rain_${Date.now().toString(36)}`;
          const rainIcon = createPrecipitationIcon(gradientId, GRADIENT_COLORS.rain);
          const rainIconSpan = createAnimatedSpan(rainIcon, baseDelay);

          // Format and animate time display
          const timeString = formatTimeString(significantRainIndex);
          const timeSpans = [...timeString].map((character, index) =>
            createAnimatedSpan(
              character,
              baseDelay + (index + 1) * PRECIPITATION_CONFIG.digitDelay
            )
          ).join('');

          return rainIconSpan + timeSpans;

        } catch (error) {
          console.error('Weather card rain field error:', error);
          const errorIcon = createSVGElement(`<path fill="var(--error-color,#ff5252)" d="${SVG_ELEMENTS.dropPath}"/>`);
          return createAnimatedSpan(errorIcon, PRECIPITATION_CONFIG.baseDelay);
        }
      ]]]

  extra_styles: |
    @keyframes cardIn {
      0% {
        transform: scale(0.96);
        opacity: 0;
        backdrop-filter: blur(4px);
      }
      100% {
        transform: scale(1);
        opacity: 1;
        backdrop-filter: blur(0);
      }
    }

    @keyframes iconIn {
      0% {
        opacity: 0;
        transform: translateY(-50%) scale(0.7) rotate(-5deg);
        filter: contrast(0.5);
      }
      70% {                                                                        /* Overshoot for bouncy effect */
        opacity: 1;
        transform: translateY(-50%) scale(1.02);
        filter: contrast(1.1);
      }
      100% {
        transform: translateY(-50%) scale(1);
        filter: contrast(1);
      }
    }

    @keyframes tempIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes digitIn {                                                           /* Individual digit stagger animation */
      from {
        opacity: 0;
        transform: scaleY(0.5) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scaleY(1) translateY(0);
      }
    }

    .rain-drop {                                                                   /* Subtle movement for rain icons */
      animation: rainDrop 3s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes rainDrop {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(1px);
      }
    }

    @media (prefers-reduced-motion: reduce) {                                      /* Accessibility: disable animations */
      *, *::before, *::after {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
        filter: none !important;
      }
    }



# | END: weather_info_card.yaml
